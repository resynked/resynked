# Bij elke push en pull request: dezelfde controle als Vercel. Zo valt een
# typfout of een kapotte pagina op voordat hij live gaat.
name: Controle

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pakketten installeren
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p .

      - name: Build
        run: npm run build
